          // Stage coordinates in percentage (0..100), (50,50) is center
          x,
          y,
          initX: x,
          initY: y,
          scale: 1,
          initScale: 1,
          rotation: 0,
          initRotation: 0,
          facing: 1, // 1 = right, -1 = left
          isWalking: false,
          visible: true,
          initVisible: true,
          speed: 'medium', // slow | medium | fast
          speechText: '',
          speechTimer: null,
          // Scripts: array of chains; each chain is { id, x, y, blocks: [ { id, type, param, children: [] } ] }
          scripts: []
        };
      }

      function createPage(index) {
        const ticChar = createCharacterFromTemplate(CHARACTER_TEMPLATES[0], 50, 50);
        return {
          id: nextId(),
          bgId: 'blank',
          customBgUrl: null,
          titleText: '',
          characters: [ticChar],
          selectedCharId: ticChar.id
        };
      }

      const state = {
        pages: [createPage(0)],
        activePageIndex: 0,
        activeCategory: 'yellow',
        showGrid: false,
        isFullscreen: false,
        isRunning: false,
        runToken: 0,
        recordedSounds: [], // Array of { id, name, audioUrl }
        history: [],        // Undo stack (deep clones of pages)
        redoStack: []       // Redo stack
      };

      // ===================================================================
      // 5. WEB AUDIO SYNTHESIZER (POP SOUND & UI CLICKS)
      // ===================================================================
      let audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playPopSound() {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(920, now + 0.065);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.13);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.45, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }

      function playSnapSound() {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.045);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.055);
      }

      // ===================================================================
      // 6. HELPERS & HISTORY MANAGEMENT
      // ===================================================================
      function getActivePage() {
        return state.pages[state.activePageIndex];
      }

      function getSelectedCharacter() {
        const page = getActivePage();
        return page.characters.find(c => c.id === page.selectedCharId) || page.characters[0] || null;
      }

      function snapshotScriptsForUndo() {
        const page = getActivePage();
        const char = getSelectedCharacter();
        if (!char) return;
        state.history.push({
          pageIndex: state.activePageIndex,
          charId: char.id,
          scripts: JSON.parse(JSON.stringify(char.scripts))
        });
        if (state.history.length > 30) state.history.shift();
        state.redoStack = [];
        updateUndoRedoButtons();
      }

      function updateUndoRedoButtons() {
        document.getElementById('btn-undo').disabled = state.history.length === 0;
        document.getElementById('btn-redo').disabled = state.redoStack.length === 0;
      }

      function showToast(msg) {
        const el = document.getElementById('toast-banner');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.add('hidden'), 2000);
      }

      // ===================================================================
      // 7. RENDERING: CHARACTERS SIDEBAR, STAGE, PAGES SIDEBAR
      // ===================================================================
      function getCharacterVisualHTML(char, extraClass = 'w-full h-full') {
        if (char.imageUrl) {
          return `<img src="${char.imageUrl}" alt="${char.name}" class="${extraClass} object-contain pointer-events-none" />`;
        }
        return `<div class="${extraClass} flex items-center justify-center pointer-events-none">${char.svg}</div>`;
      }

      function renderCharactersSidebar() {
        const list = document.getElementById('character-list');
        const page = getActivePage();
        list.innerHTML = '';

        page.characters.forEach(char => {
          const isSelected = char.id === page.selectedCharId;
          const card = document.createElement('div');
          card.className = `${isSelected ? 'sjr-card-selected' : 'sjr-card-unselected'} relative flex items-center justify-between px-2 py-1.5 cursor-pointer transition group`;

          card.innerHTML = `
            <div class="w-10 h-12 sm:w-12 sm:h-14 shrink-0 flex items-center justify-center">
              ${getCharacterVisualHTML(char)}
            </div>
            <div class="flex-1 min-w-0 px-1.5 flex flex-col items-center">
              <div class="bg-white border border-black/10 rounded-full px-2.5 py-0.5 text-center w-full shadow-2xs truncate font-extrabold text-xs sm:text-sm ${isSelected ? 'text-[#f6921e]' : 'text-gray-600'}">
                ${escapeHtml(char.name)}
              </div>
            </div>
            ${isSelected ? `
              <button data-paint-id="${char.id}" title="Paint Character" class="sjr-btn w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white border-2 border-[#3b6a9c] shadow flex items-center justify-center shrink-0">
                <svg viewBox="0 0 28 28" class="w-6 h-6">
                  <path d="M18 4 L23 9 L12 20 L7 15 Z" fill="#8d6e63" stroke="#37474f" stroke-width="1.5"/>
                  <path d="M7 15 C4 18, 3 22, 5 24 C8 25, 11 23, 12 20 Z" fill="#1e88e5"/>
                  <path d="M2 23 Q8 26 15 24" fill="none" stroke="#1e88e5" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </button>
            ` : ''}
            ${page.characters.length > 1 ? `
              <button data-del-char="${char.id}" title="Remove Character" class="hidden group-hover:flex absolute -top-2 -left-2 w-5 h-5 rounded-full bg-red-500 text-white text-xs font-extrabold items-center justify-center shadow">✕</button>
            ` : ''}
          `;

          card.addEventListener('click', (e) => {
            const paintBtn = e.target.closest('[data-paint-id]');
            const delBtn = e.target.closest('[data-del-char]');
            if (delBtn) {
              e.stopPropagation();
              page.characters = page.characters.filter(c => c.id !== char.id);
              if (page.selectedCharId === char.id) {
                page.selectedCharId = page.characters[0]?.id || null;
              }
              renderAll();
              return;
            }
            if (paintBtn) {
              e.stopPropagation();
              openPaintEditor(char);
              return;
            }
            page.selectedCharId = char.id;
            renderAll();
          });

          list.appendChild(card);
        });
      }

      function renderStage() {
        const page = getActivePage();
        const bgEl = document.getElementById('stage-background');
        const charsLayer = document.getElementById('stage-characters-layer');
        const titleEl = document.getElementById('stage-title-display');

        // Background
        if (page.customBgUrl) {
          bgEl.style.cssText = `background-image: url('${page.customBgUrl}'); background-size: cover; background-position: center;`;
          bgEl.innerHTML = '';
        } else {
          const tpl = BACKGROUND_TEMPLATES.find(b => b.id === page.bgId) || BACKGROUND_TEMPLATES[0];
          bgEl.style.cssText = tpl.css;
          bgEl.innerHTML = tpl.svg;
        }

        // Title Text
        if (page.titleText && page.titleText.trim()) {
          titleEl.textContent = page.titleText;
          titleEl.classList.remove('hidden');
        } else {
          titleEl.classList.add('hidden');
        }

        // Characters on stage
        charsLayer.innerHTML = '';
        page.characters.forEach(char => {
          const wrapper = document.createElement('div');
          wrapper.dataset.charId = char.id;
          wrapper.className = `absolute -translate-x-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing select-none ${char.isWalking ? 'char-walking' : ''}`;
          wrapper.style.left = `${char.x}%`;
          wrapper.style.top = `${char.y}%`;
          wrapper.style.width = `${15 * char.scale}%`;
          wrapper.style.minWidth = '38px';
          wrapper.style.opacity = char.visible ? '1' : '0';
          wrapper.style.pointerEvents = char.visible ? 'auto' : 'none';
          wrapper.style.zIndex = char.id === page.selectedCharId ? '15' : '10';

          wrapper.innerHTML = `
            ${char.speechText ? `
              <div class="speech-bubble absolute -top-11 left-1/2 -translate-x-1/2 text-xs sm:text-sm">
                ${escapeHtml(char.speechText)}
              </div>
            ` : ''}
            <div class="char-walk-body" style="transform: scaleX(${char.facing || 1}) rotate(${char.rotation}deg); transition: transform 0.1s linear;">
              ${getCharacterVisualHTML(char, 'w-full h-auto')}
            </div>
          `;

          // Drag or Tap character on Stage
          setupStageCharacterPointer(wrapper, char);
          charsLayer.appendChild(wrapper);
        });
      }

      function setupStageCharacterPointer(el, char) {
        let startX = 0, startY = 0, origX = 0, origY = 0, moved = false;

        el.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          getAudioContext();
          const page = getActivePage();
          page.selectedCharId = char.id;
          renderCharactersSidebar();
          renderWorkspace();

          startX = e.clientX;
          startY = e.clientY;
          origX = char.x;
          origY = char.y;
          moved = false;
          el.setPointerCapture(e.pointerId);
        });

        el.addEventListener('pointermove', (e) => {
          if (!el.hasPointerCapture(e.pointerId)) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
          if (!moved) return;

          const stageRect = document.getElementById('stage-wrapper').getBoundingClientRect();
          const nx = Math.max(4, Math.min(96, origX + (dx / stageRect.width) * 100));
          const ny = Math.max(6, Math.min(94, origY + (dy / stageRect.height) * 100));
          char.x = nx;
          char.y = ny;
          char.initX = nx;
          char.initY = ny;
          el.style.left = `${nx}%`;
          el.style.top = `${ny}%`;
        });

        el.addEventListener('pointerup', (e) => {
          if (el.hasPointerCapture(e.pointerId)) {
            el.releasePointerCapture(e.pointerId);
          }
          if (!moved) {
            // Trigger "Start on Tap" scripts for this character!
            triggerCharacterEvent(char, 'start_tap');
          } else {
            renderPagesSidebar();
          }
        });
      }

      function renderPagesSidebar() {
        const list = document.getElementById('pages-list');
        const addBtn = document.getElementById('btn-add-page');
        list.innerHTML = '';

        state.pages.forEach((pg, idx) => {
          const isActive = idx === state.activePageIndex;
          const card = document.createElement('div');
          card.className = `${isActive ? 'sjr-card-selected' : 'sjr-card-unselected'} relative aspect-[4/3] w-full p-1 cursor-pointer group`;

          const bgTpl = BACKGROUND_TEMPLATES.find(b => b.id === pg.bgId) || BACKGROUND_TEMPLATES[0];
          const bgStyle = pg.customBgUrl
            ? `background-image: url('${pg.customBgUrl}'); background-size: cover;`
            : bgTpl.css;

          const miniChars = pg.characters.filter(c => c.visible).map(c => `
            <div class="absolute -translate-x-1/2 -translate-y-1/2" style="left:${c.x}%; top:${c.y}%; width:${18 * c.scale}%;">
              ${getCharacterVisualHTML(c, 'w-full h-auto')}
            </div>
          `).join('');

          card.innerHTML = `
            <div class="w-full h-full relative overflow-hidden rounded-sm" style="${bgStyle}">
              ${!pg.customBgUrl ? bgTpl.svg : ''}
              ${miniChars}
            </div>
            <!-- Page Number Badge -->
            <div class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full ${isActive ? 'bg-[#f6921e]' : 'bg-[#9e9b92]'} text-white font-extrabold text-xs flex items-center justify-center border-2 border-white shadow">
              ${idx + 1}
            </div>
            ${state.pages.length > 1 ? `
              <button data-del-page="${idx}" title="Delete Page" class="hidden group-hover:flex absolute -top-1.5 -left-1.5 w-5 h-5 rounded-full bg-red-500 text-white text-xs font-extrabold items-center justify-center shadow">✕</button>
            ` : ''}
          `;

          card.addEventListener('click', (e) => {
            const delBtn = e.target.closest('[data-del-page]');
            if (delBtn) {
              e.stopPropagation();
              stopAllScripts();
              state.pages.splice(idx, 1);
              if (state.activePageIndex >= state.pages.length) {
                state.activePageIndex = state.pages.length - 1;
              }
              renderAll();
              return;
            }
            stopAllScripts();
            state.activePageIndex = idx;
            renderAll();
          });

          list.appendChild(card);
        });

        // ScratchJr allows up to 4 pages
        addBtn.style.display = state.pages.length >= 4 ? 'none' : 'flex';
      }

      // ===================================================================
      // 8. PUZZLE BLOCK SVG GENERATOR (EXACT SCRATCHJR SHAPES)
      // ===================================================================
      function buildBlockHTML(block, options = {}) {
        const def = BLOCK_DEFS[block.type];
        const color = CATEGORY_COLORS[def.cat];
        const isPalette = !!options.isPalette;
        const w = def.shape === 'c_loop' ? 116 : 64;
        const h = 54;

        // Puzzle SVG Path
        let svgPath = '';
        if (def.shape === 'hat') {
          // Rounded left cap + puzzle tab on right
          svgPath = `M 16,4 L 52,4 Q 55,4 55,7 L 55,18 C 63,18 63,32 55,32 L 55,43 Q 55,46 52,46 L 16,46 A 14,21 0 0 1 16,4 Z`;
        } else if (def.shape === 'cap') {
          // Left socket notch + rounded flat right end
          svgPath = `M 6,4 L 46,4 A 14,21 0 0 1 46,46 L 6,46 Q 3,46 3,43 L 3,32 C 11,32 11,18 3,18 L 3,7 Q 3,4 6,4 Z`;
        } else if (def.shape === 'c_loop') {
          // C-shaped repeat wrapper block
          svgPath = `M 6,4 L 104,4 Q 108,4 108,8 L 108,42 Q 108,46 104,46 L 84,46 L 84,38 L 32,38 L 32,46 L 6,46 Q 3,46 3,43 L 3,32 C 11,32 11,18 3,18 L 3,7 Q 3,4 6,4 Z`;
        } else {
          // Standard stackable puzzle block: left notch + right tab
          svgPath = `M 6,4 L 52,4 Q 55,4 55,7 L 55,18 C 63,18 63,32 55,32 L 55,43 Q 55,46 52,46 L 6,46 Q 3,46 3,43 L 3,32 C 11,32 11,18 3,18 L 3,7 Q 3,4 6,4 Z`;
        }

        // Resolve Icon
        let iconMarkup = '';
        if (typeof def.icon === 'function') {
          if (def.paramType === 'color') {
            const cObj = MESSAGE_COLORS.find(m => m.id === block.param) || MESSAGE_COLORS[0];
            iconMarkup = def.icon(cObj.hex);
          } else if (def.paramType === 'page') {
            iconMarkup = def.icon(block.param || 2);
          }
        } else {
          iconMarkup = def.icon;
        }

        // Parameter Pill at Bottom of Block
        let paramPill = '';
        if (def.paramType === 'number') {
          paramPill = `
            <button data-param-btn="${block.id}" class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 bg-white text-gray-800 border border-black/25 rounded-full px-2 min-w-[26px] h-[18px] text-[11px] font-extrabold leading-none flex items-center justify-center shadow-xs hover:scale-105">
              ${block.param}
            </button>
          `;
        } else if (def.paramType === 'text') {
          paramPill = `
            <button data-param-btn="${block.id}" class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 bg-white text-gray-800 border border-black/25 rounded-full px-2 max-w-[54px] h-[18px] text-[10px] font-extrabold leading-none flex items-center justify-center shadow-xs truncate hover:scale-105">
              ${escapeHtml(String(block.param))}
            </button>
          `;
        } else if (def.paramType === 'color') {
          const cObj = MESSAGE_COLORS.find(m => m.id === block.param) || MESSAGE_COLORS[0];
          paramPill = `
            <button data-param-btn="${block.id}" class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 bg-white border border-black/25 rounded-full px-1.5 h-[16px] flex items-center justify-center shadow-xs">
              <span class="w-2.5 h-2.5 rounded-full" style="background:${cObj.hex}"></span>
            </button>
          `;
        } else if (def.paramType === 'speed') {
          const arrows = block.param === 'slow' ? '›' : (block.param === 'fast' ? '›››' : '››');
          paramPill = `
            <button data-param-btn="${block.id}" class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 bg-white text-[#f5a623] border border-black/25 rounded-full px-2 h-[17px] text-xs font-black leading-none flex items-center justify-center shadow-xs">
              ${arrows}
            </button>
          `;
        } else if (def.subLabel) {
          paramPill = `
            <span class="absolute bottom-1 left-1/2 -translate-x-1/2 text-[9px] font-extrabold text-black/60 leading-none pointer-events-none">
              ${def.subLabel}
            </span>
          `;
        }

        return `
          <div class="relative inline-flex items-center justify-center select-none" style="width:${w}px; height:${h}px;">
            <svg viewBox="0 0 ${w} ${h}" class="w-full h-full drop-shadow-[0_2px_2px_rgba(0,0,0,0.28)] overflow-visible">
              <path d="${svgPath}" fill="${color}" stroke="rgba(0,0,0,0.22)" stroke-width="1.4"/>
              <path d="${svgPath}" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" transform="translate(0, 1)"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center pb-1 pointer-events-none">
              ${iconMarkup}
            </div>
            ${!isPalette ? paramPill : (def.paramType ? `
              <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-white text-gray-700 border border-black/20 rounded-full px-2 min-w-[24px] h-[16px] text-[10px] font-extrabold flex items-center justify-center pointer-events-none">
                ${def.paramType === 'color' ? '▾' : (def.paramType === 'speed' ? '▾' : block.param)}
              </div>
            ` : '')}
          </div>
        `;
      }

      // ===================================================================
      // 9. RENDERING: PALETTE BAR & WORKSPACE BLOCK CHAINS
      // ===================================================================
      function renderPalette() {
        const tray = document.getElementById('palette-tray-container');
        const blocksEl = document.getElementById('palette-blocks');
        const cat = state.activeCategory;

        tray.style.backgroundColor = CATEGORY_COLORS[cat];

        // Update active tab styling
        document.querySelectorAll('.cat-tab').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.cat === cat);
        });

        blocksEl.innerHTML = '';

        // Determine available block types for this category
        let types = Object.keys(BLOCK_DEFS).filter(k => BLOCK_DEFS[k].cat === cat);

        // Special handling for Red "Go to Page" blocks (only appear when >1 page exists)
        if (cat === 'red') {
          types = ['end', 'end_forever'];
          if (state.pages.length > 1) {
            state.pages.forEach((_, idx) => {
              if (idx !== state.activePageIndex) {
                types.push(`goto_page_${idx + 1}`);
              }
            });
          }
        }

        // Special handling for Green Sound category (Pop + Record Mic Button + Recorded Sounds)
        if (cat === 'green') {
          // 1. Pop block
          appendPaletteBlock('play_pop', 'pop');
          // 2. Recorded sounds if any
          state.recordedSounds.forEach((snd, i) => {
            appendPaletteBlock('play_rec', snd.id, i + 1);
          });
          // 3. Dashed Microphone Record Button (exact match to screenshot!)
          const micBtn = document.createElement('button');
          micBtn.title = 'Record New Sound';
          micBtn.className = 'sjr-btn w-12 h-11 rounded-xl border-2 border-dashed border-white/85 flex items-center justify-center hover:bg-white/15 ml-1';
          micBtn.innerHTML = `
            <svg viewBox="0 0 24 26" class="w-6 h-6 text-white">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
              <path d="M6 11a6 6 0 0 0 12 0M12 17v5M9 22h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          `;
          micBtn.addEventListener('click', openSoundRecorder);
          blocksEl.appendChild(micBtn);
          return;
        }

        types.forEach(typeKey => {
          if (typeKey.startsWith('goto_page_')) {
            const targetPageNum = parseInt(typeKey.split('_')[2], 10);
            appendPaletteBlock('goto_page', targetPageNum);
          } else {
            const def = BLOCK_DEFS[typeKey];
            appendPaletteBlock(typeKey, def.defaultParam);
          }
        });

        function appendPaletteBlock(type, param, badgeNum = null) {
          const item = document.createElement('div');
          item.className = 'cursor-grab active:cursor-grabbing relative shrink-0';
          item.innerHTML = buildBlockHTML({ id: 'pal', type, param }, { isPalette: true });
          if (badgeNum !== null) {
            const badge = document.createElement('span');
            badge.className = 'absolute -bottom-1 left-1/2 -translate-x-1/2 bg-white text-[#2e7d32] rounded-full px-1.5 text-[10px] font-extrabold border border-black/20';
            badge.textContent = badgeNum;
            item.appendChild(badge);
          }

          // Pointer drag from palette to workspace
          item.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            getAudioContext();
            startPaletteDrag(e, type, param);
          });

          blocksEl.appendChild(item);
        }
      }

      function renderWorkspace() {
        const ws = document.getElementById('workspace-area');
        const watermark = document.getElementById('workspace-watermark');
        const char = getSelectedCharacter();

        ws.innerHTML = '';
        if (!char) {
          watermark.innerHTML = '';
          return;
        }

        // Bottom-left character outline watermark (matching screenshots)
        watermark.innerHTML = getCharacterVisualHTML(char);

        // Render each chain of blocks
        char.scripts.forEach(chain => {
          const chainEl = document.createElement('div');
          chainEl.dataset.chainId = chain.id;
          chainEl.className = 'absolute flex items-center select-none';
          chainEl.style.left = `${chain.x}px`;
          chainEl.style.top = `${chain.y}px`;

          chain.blocks.forEach((blk, bIdx) => {
            const blkWrapper = document.createElement('div');
            blkWrapper.dataset.blockId = blk.id;
            blkWrapper.dataset.chainId = chain.id;
            blkWrapper.dataset.blockIndex = bIdx;
            blkWrapper.className = 'relative flex items-center cursor-grab active:cursor-grabbing';
            // Overlap puzzle tabs slightly so they interlock seamlessly
            if (bIdx > 0) blkWrapper.style.marginLeft = '-9px';

            if (blk.type === 'repeat') {
              // C-Loop Repeat Block with inner child blocks
              blkWrapper.innerHTML = renderRepeatBlockHTML(blk);
            } else {
              blkWrapper.innerHTML = buildBlockHTML(blk, { isPalette: false });
            }

            // Parameter pill click handler
            blkWrapper.querySelectorAll('[data-param-btn]').forEach(pBtn => {
              pBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
              pBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const targetId = pBtn.dataset.paramBtn;
                const targetBlock = findBlockById(char, targetId);
                if (targetBlock) openParameterEditor(pBtn, targetBlock);
              });
            });

            // Drag or Tap block in workspace
            setupWorkspaceBlockPointer(blkWrapper, chain, bIdx);
            chainEl.appendChild(blkWrapper);
          });

          ws.appendChild(chainEl);
        });
      }

      function renderRepeatBlockHTML(repeatBlk) {
        const children = repeatBlk.children || [];
        const innerWidth = Math.max(46, children.length * 55 + 10);
        const totalWidth = innerWidth + 68;
        const h = 58;
        const color = CATEGORY_COLORS.orange;

        // Dynamic C-shaped SVG path stretched around inner blocks
        const svgPath = `
          M 6,2
          L ${totalWidth - 8},2
          Q ${totalWidth - 4},2 ${totalWidth - 4},6
          L ${totalWidth - 4},46
          Q ${totalWidth - 4},50 ${totalWidth - 8},50
          L ${totalWidth - 26},50
          L ${totalWidth - 26},12
          L 32,12
          L 32,50
          L 6,50
          Q 3,50 3,47
          L 3,34
          C 11,34 11,20 3,20
          L 3,6
          Q 3,2 6,2 Z
        `;

        const innerHTML = children.map((child, idx) => `
          <div data-child-id="${child.id}" class="relative shrink-0" style="margin-left:${idx > 0 ? '-8px' : '0'}; transform: scale(0.76); transform-origin: center;">
            ${buildBlockHTML(child, { isPalette: false })}
          </div>
        `).join('');

        return `
          <div class="relative flex items-center" style="width:${totalWidth}px; height:${h}px;">
            <svg viewBox="0 0 ${totalWidth} ${h}" class="w-full h-full drop-shadow-[0_2px_2px_rgba(0,0,0,0.28)] overflow-visible">
              <path d="${svgPath}" fill="${color}" stroke="rgba(0,0,0,0.22)" stroke-width="1.4"/>
            </svg>
            <!-- Left Loop Icon -->
            <div class="absolute left-2 top-3 pointer-events-none">
              ${BLOCK_DEFS.repeat.icon}
            </div>
            <!-- Inner Child Blocks Container -->
            <div class="repeat-inner-slot absolute left-[32px] top-[11px] flex items-center h-[38px] px-1">
              ${innerHTML || `<span class="text-[10px] font-bold text-white/75 px-1">drop</span>`}
            </div>
            <!-- Right Repeat Count Pill -->
            <button data-param-btn="${repeatBlk.id}" class="absolute -bottom-1 right-2 bg-white text-gray-800 border border-black/25 rounded-full px-2 min-w-[26px] h-[18px] text-[11px] font-extrabold flex items-center justify-center shadow-xs">
              ${repeatBlk.param}
            </button>
          </div>
        `;
      }

      function findBlockById(char, blockId) {
        for (const chain of char.scripts) {
          for (const b of chain.blocks) {
            if (b.id === blockId) return b;
            if (b.children) {
              const found = b.children.find(c => c.id === blockId);
              if (found) return found;
            }
          }
        }
        return null;
      }

      // ===================================================================
      // 10. DRAG & DROP ENGINE (PALETTE -> WORKSPACE, SNAPPING, DELETE)
      // ===================================================================
      function startPaletteDrag(e, type, param) {
        const char = getSelectedCharacter();
        if (!char) return;

        const proxy = document.createElement('div');
        proxy.className = 'drag-proxy';
        proxy.innerHTML = buildBlockHTML({ id: 'ghost', type, param }, { isPalette: false });
        document.body.appendChild(proxy);

        const moveProxy = (cx, cy) => {
          proxy.style.left = `${cx - 32}px`;
          proxy.style.top = `${cy - 27}px`;
        };
        moveProxy(e.clientX, e.clientY);

        const onMove = (ev) => moveProxy(ev.clientX, ev.clientY);
        const onUp = (ev) => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          proxy.remove();

          const wsRect = document.getElementById('workspace-area').getBoundingClientRect();
          if (ev.clientY >= wsRect.top - 10) {
            const dropX = Math.max(12, Math.min(wsRect.width - 80, ev.clientX - wsRect.left - 32));
            const dropY = Math.max(12, Math.min(wsRect.height - 65, ev.clientY - wsRect.top - 27));
            const newBlock = {
              id: nextId(),
              type,
              param,
              children: type === 'repeat' ? [] : undefined
            };
            snapshotScriptsForUndo();
            insertBlockAtPosition(char, [newBlock], dropX, dropY);
            playSnapSound();
            renderWorkspace();
          }
        };

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      }

      function setupWorkspaceBlockPointer(el, chain, blockIndex) {
        let startX = 0, startY = 0, moved = false;

        el.addEventListener('pointerdown', (e) => {
          if (e.target.closest('[data-param-btn]')) return;
          e.stopPropagation();
          getAudioContext();
          startX = e.clientX;
          startY = e.clientY;
          moved = false;

          const char = getSelectedCharacter();
          const wsRect = document.getElementById('workspace-area').getBoundingClientRect();

          const onMove = (ev) => {
            const dx = ev.clientX - startX;
            const dy = ev.clientY - startY;
            if (!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
              moved = true;
              snapshotScriptsForUndo();

              // Detach dragged sub-chain from blockIndex onward
              const detachedBlocks = chain.blocks.splice(blockIndex);
              if (chain.blocks.length === 0) {
                char.scripts = char.scripts.filter(c => c.id !== chain.id);
              }
              renderWorkspace();

              // Create floating proxy for the detached blocks
              const proxy = document.createElement('div');
              proxy.className = 'drag-proxy flex items-center';
              detachedBlocks.forEach((b, i) => {
                const wrap = document.createElement('div');
                if (i > 0) wrap.style.marginLeft = '-9px';
                wrap.innerHTML = b.type === 'repeat' ? renderRepeatBlockHTML(b) : buildBlockHTML(b);
                proxy.appendChild(wrap);
              });
              document.body.appendChild(proxy);
              el._proxy = proxy;
              el._detached = detachedBlocks;
            }

            if (moved && el._proxy) {
              el._proxy.style.left = `${ev.clientX - 32}px`;
              el._proxy.style.top = `${ev.clientY - 27}px`;
            }
          };

          const onUp = (ev) => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);

            if (!moved) {
              // Tapped a block in workspace -> execute that entire chain immediately!
              runScriptChain(char, chain, state.runToken);
              return;
            }

            if (el._proxy) {
              el._proxy.remove();
              const blocks = el._detached;
              // If dragged above workspace (into palette), delete blocks!
              if (ev.clientY < wsRect.top) {
                playSnapSound();
                renderWorkspace();
                return;
              }
              const dropX = Math.max(10, Math.min(wsRect.width - 70, ev.clientX - wsRect.left - 32));
              const dropY = Math.max(10, Math.min(wsRect.height - 60, ev.clientY - wsRect.top - 27));
              insertBlockAtPosition(char, blocks, dropX, dropY);
              playSnapSound();
              renderWorkspace();
            }
          };

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
      }

      function insertBlockAtPosition(char, blocks, x, y) {
        const firstBlock = blocks[0];
        const firstDef = BLOCK_DEFS[firstBlock.type];

        // 1. Check if dropped inside an existing C-loop Repeat block
        if (firstDef.shape === 'stack' && firstBlock.type !== 'repeat') {
          for (const chain of char.scripts) {
            let curX = chain.x;
            for (const b of chain.blocks) {
              const bWidth = b.type === 'repeat' ? Math.max(114, (b.children?.length || 0) * 55 + 78) : 55;
              if (b.type === 'repeat') {
                if (x >= curX + 20 && x <= curX + bWidth - 10 && Math.abs(y - chain.y) < 34) {
                  b.children = b.children || [];
                  b.children.push(...blocks);
                  return;
                }
              }
              curX += bWidth;
            }
          }
        }

        // 2. Check magnetic snapping to the right end of an existing chain (if firstBlock is not a 'hat')
        if (firstDef.shape !== 'hat') {
          for (const chain of char.scripts) {
            const lastBlock = chain.blocks[chain.blocks.length - 1];
            const lastDef = BLOCK_DEFS[lastBlock.type];
            if (lastDef.shape === 'cap') continue; // Cannot attach after a red End block

            const chainPixelWidth = chain.blocks.reduce((acc, b) => {
              return acc + (b.type === 'repeat' ? Math.max(114, (b.children?.length || 0) * 55 + 78) : 55);
            }, 0);

            const tailX = chain.x + chainPixelWidth;
            const tailY = chain.y;

            if (Math.abs(x - tailX) < 42 && Math.abs(y - tailY) < 34) {
              chain.blocks.push(...blocks);
              return;
            }
          }
        }

        // 3. Otherwise create a standalone chain at (x, y)
        char.scripts.push({
          id: nextId(),
          x,
          y,
          blocks
        });
      }

      // ===================================================================
      // 11. PARAMETER EDITORS (KEYPAD, SAY TEXT, ENVELOPE COLOR, SPEED)
      // ===================================================================
      let activeKeypadBlock = null;
      let keypadBuffer = '';

      function openParameterEditor(anchorEl, block) {
        const def = BLOCK_DEFS[block.type];
        const rect = anchorEl.getBoundingClientRect();

        if (def.paramType === 'number') {
          activeKeypadBlock = block;
          keypadBuffer = '';
          const kp = document.getElementById('keypad-popover');
          document.getElementById('keypad-display').textContent = block.param;
          kp.style.left = `${Math.max(10, Math.min(window.innerWidth - 220, rect.left - 80))}px`;
          kp.style.top = `${Math.max(10, rect.top - 255)}px`;
          kp.classList.remove('hidden');
          return;
        }

        const pop = document.getElementById('param-popover');
        const content = document.getElementById('param-popover-content');
        pop.style.left = `${Math.max(10, Math.min(window.innerWidth - 240, rect.left - 60))}px`;
        pop.style.top = `${Math.max(10, rect.top - 95)}px`;

        if (def.paramType === 'text') {
          content.innerHTML = `
            <div class="flex items-center gap-2">
              <input id="say-text-input" type="text" maxlength="28" value="${escapeHtml(block.param)}" class="border-2 border-[#c86dd7] rounded-xl px-3 py-1.5 font-bold text-gray-800 w-40 outline-none"/>
              <button id="say-text-ok" class="sjr-btn bg-[#c86dd7] text-white font-extrabold px-3 py-1.5 rounded-xl">OK</button>
            </div>
          `;
          pop.classList.remove('hidden');
          const inp = document.getElementById('say-text-input');
          inp.focus();
          inp.select();
          document.getElementById('say-text-ok').onclick = () => {
            snapshotScriptsForUndo();
            block.param = inp.value || 'hi';
            pop.classList.add('hidden');
            renderWorkspace();
          };
        } else if (def.paramType === 'color') {
          content.innerHTML = `
            <div class="flex items-center gap-2">
              ${MESSAGE_COLORS.map(c => `
                <button data-pick-color="${c.id}" class="sjr-btn w-8 h-8 rounded-full border-2 ${block.param === c.id ? 'border-black scale-110' : 'border-white'} shadow" style="background:${c.hex}"></button>
              `).join('')}
            </div>
          `;
          pop.classList.remove('hidden');
          content.querySelectorAll('[data-pick-color]').forEach(btn => {
            btn.onclick = () => {
              snapshotScriptsForUndo();
              block.param = btn.dataset.pickColor;
              pop.classList.add('hidden');
              renderWorkspace();
            };
          });
        } else if (def.paramType === 'speed') {
          content.innerHTML = `
            <div class="flex items-center gap-2">
              <button data-pick-speed="slow" class="sjr-btn px-3 py-1.5 rounded-xl font-extrabold text-sm ${block.param === 'slow' ? 'bg-[#f5a623] text-white' : 'bg-gray-100 text-gray-700'}">Slow ›</button>
              <button data-pick-speed="medium" class="sjr-btn px-3 py-1.5 rounded-xl font-extrabold text-sm ${block.param === 'medium' ? 'bg-[#f5a623] text-white' : 'bg-gray-100 text-gray-700'}">Med ››</button>
              <button data-pick-speed="fast" class="sjr-btn px-3 py-1.5 rounded-xl font-extrabold text-sm ${block.param === 'fast' ? 'bg-[#f5a623] text-white' : 'bg-gray-100 text-gray-700'}">Fast ›››</button>
            </div>
          `;
          pop.classList.remove('hidden');
          content.querySelectorAll('[data-pick-speed]').forEach(btn => {
            btn.onclick = () => {
              snapshotScriptsForUndo();
              block.param = btn.dataset.pickSpeed;
              pop.classList.add('hidden');
              renderWorkspace();
            };
          });
        }
      }

      // Keypad Events
      document.querySelectorAll('.kp-num').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!activeKeypadBlock) return;
          if (keypadBuffer.length < 2) {
            keypadBuffer += btn.dataset.val;
            document.getElementById('keypad-display').textContent = parseInt(keypadBuffer, 10);
          }
        });
      });
      document.getElementById('kp-clear').addEventListener('click', () => {
        keypadBuffer = '0';
        document.getElementById('keypad-display').textContent = '0';
      });
      document.getElementById('kp-done').addEventListener('click', () => {
        if (activeKeypadBlock && keypadBuffer !== '') {
          snapshotScriptsForUndo();
          activeKeypadBlock.param = parseInt(keypadBuffer, 10);
          renderWorkspace();
        }
        document.getElementById('keypad-popover').classList.add('hidden');
        activeKeypadBlock = null;
      });

      // Dismiss popovers on outside tap
      document.addEventListener('pointerdown', (e) => {
        const kp = document.getElementById('keypad-popover');
        const pop = document.getElementById('param-popover');
        if (!kp.classList.contains('hidden') && !kp.contains(e.target)) {
          kp.classList.add('hidden');
          activeKeypadBlock = null;
        }
        if (!pop.classList.contains('hidden') && !pop.contains(e.target)) {
          pop.classList.add('hidden');
        }
      });

      // ===================================================================
      // 12. EXECUTION ENGINE (RUNS BLOCKS SMOOTHLY ON STAGE)
      // ===================================================================
      function setRunningUI(running) {
        state.isRunning = running;
        document.getElementById('icon-flag-go').classList.toggle('hidden', running);
        document.getElementById('icon-flag-stop').classList.toggle('hidden', !running);
      }

      function stopAllScripts() {
        state.runToken++;
        setRunningUI(false);
        document.querySelectorAll('.block-running').forEach(el => el.classList.remove('block-running'));
      }

      function resetAllCharactersOnPage() {
        stopAllScripts();
        const page = getActivePage();
        page.characters.forEach(c => {
          c.x = c.initX;
          c.y = c.initY;
          c.scale = c.initScale;
          c.rotation = c.initRotation;
          c.facing = 1;
          c.isWalking = false;
          c.visible = c.initVisible;
          c.speed = 'medium';
          c.speechText = '';
        });
        renderStage();
        renderPagesSidebar();
      }

      function triggerGreenFlag() {
        if (state.isRunning) {
          stopAllScripts();
          return;
        }
        getAudioContext();
        state.runToken++;
        const token = state.runToken;
        setRunningUI(true);

        const page = getActivePage();
        const promises = [];

        page.characters.forEach(char => {
          char.scripts.forEach(chain => {
            if (chain.blocks.length > 0 && chain.blocks[0].type === 'start_flag') {
              promises.push(runScriptChain(char, chain, token));
            }
          });
        });

        if (promises.length === 0) {
          setTimeout(() => {
            if (state.runToken === token) setRunningUI(false);
          }, 250);
        } else {
          Promise.all(promises).then(() => {
            if (state.runToken === token) setRunningUI(false);
          });
        }
      }

      function triggerCharacterEvent(char, eventType, paramFilter = null) {
        const token = state.runToken;
        char.scripts.forEach(chain => {
          if (chain.blocks.length === 0) return;
          const head = chain.blocks[0];
          if (head.type === eventType) {
            if (paramFilter === null || head.param === paramFilter) {
              runScriptChain(char, chain, token);
            }
          }
        });
      }

      function broadcastMessage(colorId, token) {
        const page = getActivePage();
        page.characters.forEach(char => {
          triggerCharacterEvent(char, 'start_msg', colorId);
        });
      }

      function getStepDelay(char) {
        if (char.speed === 'fast') return 110;
        if (char.speed === 'slow') return 420;
        return 230;
      }

      const sleep = (ms) => new Promise(res => setTimeout(res, ms));

      // Smoothly glides a character step-by-step while animating legs/arms walking cycle
      async function animateCharacterWalk(char, dxTotal, dyTotal, totalDurationMs, token) {
        char.isWalking = true;
        if (dxTotal > 0) char.facing = 1;
        else if (dxTotal < 0) char.facing = -1;

        const subSteps = Math.max(4, Math.round(totalDurationMs / 35));
        const stepDelay = totalDurationMs / subSteps;
        const stepDx = dxTotal / subSteps;
        const stepDy = dyTotal / subSteps;

        for (let i = 0; i < subSteps; i++) {
          if (state.runToken !== token) break;
          char.x = ((char.x + stepDx) % 100 + 100) % 100;
          char.y = ((char.y + stepDy) % 100 + 100) % 100;
          renderStage();
          await sleep(stepDelay);
        }

        char.isWalking = false;
        renderStage();
      }

      async function runScriptChain(char, chain, token) {
        let keepLooping = true;
        while (keepLooping && state.runToken === token) {
          keepLooping = false;
          for (let i = 0; i < chain.blocks.length; i++) {
            if (state.runToken !== token) return;
            const blk = chain.blocks[i];

            if (blk.type === 'end_forever') {
              keepLooping = true;
              await sleep(60);
              break;
            }

            await executeSingleBlock(char, blk, token);
          }
        }
      }

      async function executeSingleBlock(char, blk, token) {
        if (state.runToken !== token) return;

        // Highlight block if currently visible in workspace
        const domEl = document.querySelector(`[data-block-id="${blk.id}"]`);
        if (domEl) domEl.classList.add('block-running');

        const stepMs = getStepDelay(char);
        // 1 grid unit = 5% horizontally (20 cols), 6.67% vertically (15 rows)
        const stepX = 5;
        const stepY = 6.6667;

        switch (blk.type) {
          case 'start_flag':
          case 'start_tap':
          case 'start_bump':
          case 'start_msg':
          case 'end':
            await sleep(60);
            break;

          case 'send_msg':
            broadcastMessage(blk.param, token);
            await sleep(100);
            break;

          case 'move_right': {
            const count = Number(blk.param) || 0;
            for (let s = 0; s < count; s++) {
              if (state.runToken !== token) break;
              await animateCharacterWalk(char, stepX, 0, stepMs, token);
              checkBumpCollisions(char, token);
            }
            break;
          }

          case 'move_left': {
            const count = Number(blk.param) || 0;
            for (let s = 0; s < count; s++) {
              if (state.runToken !== token) break;
              await animateCharacterWalk(char, -stepX, 0, stepMs, token);
              checkBumpCollisions(char, token);
            }
            break;
          }

          case 'move_up': {
            const count = Number(blk.param) || 0;
            for (let s = 0; s < count; s++) {
              if (state.runToken !== token) break;
              await animateCharacterWalk(char, 0, -stepY, stepMs, token);
              checkBumpCollisions(char, token);
            }
            break;
          }

          case 'move_down': {
            const count = Number(blk.param) || 0;
            for (let s = 0; s < count; s++) {
              if (state.runToken !== token) break;
              await animateCharacterWalk(char, 0, stepY, stepMs, token);
              checkBumpCollisions(char, token);
            }
            break;
          }

          case 'move_left': {
            const count = Number(blk.param) || 0;
            for (let s = 0; s < count; s++) {
              if (state.runToken !== token) break;
              char.x = ((char.x - stepX) % 100 + 100) % 100;
              renderStage();
              checkBumpCollisions(char, token);
              await sleep(stepMs);
            }
            break;
          }

          case 'move_up': {
            const count = Number(blk.param) || 0;
            for (let s = 0; s < count; s++) {
              if (state.runToken !== token) break;
              char.y = ((char.y - stepY) % 100 + 100) % 100;
              renderStage();
              checkBumpCollisions(char, token);
              await sleep(stepMs);
            }
            break;
          }

          case 'move_down': {
            const count = Number(blk.param) || 0;
            for (let s = 0; s < count; s++) {
              if (state.runToken !== token) break;
              char.y = ((char.y + stepY) % 100 + 100) % 100;
              renderStage();
              checkBumpCollisions(char, token);
              await sleep(stepMs);
            }
            break;
          }

          case 'turn_right': {
            const count = Number(blk.param) || 0;
            for (let s = 0; s < count; s++) {
              if (state.runToken !== token) break;
              char.rotation = (char.rotation + 30) % 360;
              renderStage();
              await sleep(stepMs * 0.7);
            }
            break;
          }

          case 'turn_left': {
            const count = Number(blk.param) || 0;
            for (let s = 0; s < count; s++) {
              if (state.runToken !== token) break;
              char.rotation = (char.rotation - 30 + 360) % 360;
              renderStage();
              await sleep(stepMs * 0.7);
            }
            break;
          }

          case 'hop': {
            const heightUnits = Number(blk.param) || 2;
            const jumpPx = heightUnits * stepY;
            const origY = char.y;
            char.y = Math.max(5, origY - jumpPx);
            renderStage();
            await sleep(stepMs * 0.9);
            if (state.runToken === token) {
              char.y = origY;
              renderStage();
              await sleep(stepMs * 0.9);
            }
            break;
          }

          case 'go_home':
            char.x = char.initX;
            char.y = char.initY;
            char.rotation = char.initRotation;
            char.facing = 1;
            char.isWalking = false;
            renderStage();
            await sleep(stepMs);
            break;

          case 'say':
            char.speechText = String(blk.param || 'hi');
            renderStage();
            await sleep(1100);
            if (state.runToken === token) {
              char.speechText = '';
              renderStage();
            }
            break;

          case 'grow': {
            const steps = Number(blk.param) || 2;
            char.scale = Math.min(2.6, char.scale + steps * 0.15);
            renderStage();
            await sleep(stepMs);
            break;
          }

          case 'shrink': {
            const steps = Number(blk.param) || 2;
            char.scale = Math.max(0.35, char.scale - steps * 0.15);
            renderStage();
            await sleep(stepMs);
            break;
          }

          case 'reset_size':
            char.scale = 1;
            renderStage();
            await sleep(stepMs);
            break;

          case 'hide':
            char.visible = false;
            renderStage();
            await sleep(stepMs);
            break;

          case 'show':
            char.visible = true;
            renderStage();
            await sleep(stepMs);
            break;

          case 'play_pop':
            playPopSound();
            await sleep(220);
            break;

          case 'play_rec': {
            const snd = state.recordedSounds.find(s => s.id === blk.param);
            if (snd && snd.audioUrl) {
              const audio = new Audio(snd.audioUrl);
              await new Promise(resolve => {
                audio.onended = resolve;
                audio.onerror = resolve;
                audio.play().catch(resolve);
              });
            }
            break;
          }

          case 'wait': {
            const tenths = Number(blk.param) || 10;
            await sleep(tenths * 100);
            break;
          }

          case 'stop':
            stopAllScripts();
            break;

          case 'speed':
            char.speed = blk.param || 'medium';
            await sleep(80);
            break;

          case 'repeat': {
            const times = Number(blk.param) || 4;
            const children = blk.children || [];
            for (let r = 0; r < times; r++) {
              if (state.runToken !== token) break;
              for (const child of children) {
                if (state.runToken !== token) break;
                await executeSingleBlock(char, child, token);
              }
            }
            break;
          }

          case 'goto_page': {
            const targetIdx = (Number(blk.param) || 1) - 1;
            if (state.pages[targetIdx]) {
              stopAllScripts();
              state.activePageIndex = targetIdx;
              renderAll();
              setTimeout(() => triggerGreenFlag(), 120);
            }
            break;
          }
        }

        if (domEl) domEl.classList.remove('block-running');
        renderPagesSidebar();
      }

      function checkBumpCollisions(moverChar, token) {
        if (!moverChar.visible) return;
        const page = getActivePage();
        page.characters.forEach(other => {
          if (other.id === moverChar.id || !other.visible) return;
          const dist = Math.hypot(moverChar.x - other.x, moverChar.y - other.y);
          if (dist < 11) {
            triggerCharacterEvent(moverChar, 'start_bump');
            triggerCharacterEvent(other, 'start_bump');
          }
        });
      }

      // ===================================================================
      // 13. MODALS: CHARACTER LIBRARY, BACKGROUND LIBRARY, PAINT EDITOR, MIC
      // ===================================================================
      function openCharacterLibrary() {
        const modal = document.getElementById('modal-characters');
        const grid = document.getElementById('char-library-grid');
        grid.innerHTML = '';

        CHARACTER_TEMPLATES.forEach(tpl => {
          const card = document.createElement('button');
          card.className = 'sjr-btn bg-white border-2 border-gray-200 hover:border-[#f6921e] rounded-2xl p-3 flex flex-col items-center gap-2 shadow-sm';
          card.innerHTML = `
            <div class="w-16 h-20 flex items-center justify-center">${tpl.svg}</div>
            <span class="font-extrabold text-sm text-gray-700">${tpl.name}</span>
          `;
          card.onclick = () => {
            const page = getActivePage();
            const offset = (page.characters.length % 5) * 8;
            const newChar = createCharacterFromTemplate(tpl, 35 + offset, 50);
            page.characters.push(newChar);
            page.selectedCharId = newChar.id;
            modal.classList.add('hidden');
            renderAll();
          };
          grid.appendChild(card);
        });

        modal.classList.remove('hidden');
      }

      function openBackgroundLibrary() {
        const modal = document.getElementById('modal-backgrounds');
        const grid = document.getElementById('bg-library-grid');
        grid.innerHTML = '';

        BACKGROUND_TEMPLATES.forEach(bg => {
          const card = document.createElement('button');
          card.className = 'sjr-btn bg-white border-2 border-gray-200 hover:border-[#48a842] rounded-2xl p-2 flex flex-col items-center gap-1.5 shadow-sm';
          card.innerHTML = `
            <div class="w-full aspect-[4/3] rounded-xl overflow-hidden border border-gray-200 relative" style="${bg.css}">
              ${bg.svg}
            </div>
            <span class="font-extrabold text-xs text-gray-700">${bg.name}</span>
          `;
          card.onclick = () => {
            const page = getActivePage();
            page.bgId = bg.id;
            page.customBgUrl = null;
            modal.classList.add('hidden');
            renderStage();
            renderPagesSidebar();
          };
          grid.appendChild(card);
        });

        modal.classList.remove('hidden');
      }

      // Paint Editor State & Logic
      let paintTargetChar = null;
      let paintIsNew = false;
      let paintTool = 'brush';
      let paintColor = '#29b6f6';
      let paintSize = 9;
      let paintUndoStack = [];

      const PAINT_PALETTE = [
        '#111111', '#ffffff', '#e53935', '#f58220',
        '#fdd835', '#4cd964', '#2e7d32', '#29b6f6',
        '#1e88e5', '#8e24aa', '#f06292', '#8d6e63',
        '#90a4ae', '#ffcc80', '#b2ebf2', '#c5e1a5'
      ];

      function initPaintPalette() {
        const container = document.getElementById('paint-colors');
        container.innerHTML = '';
        PAINT_PALETTE.forEach(hex => {
          const swatch = document.createElement('button');
          swatch.className = `sjr-btn w-8 h-8 rounded-full border-2 ${hex === paintColor ? 'border-black scale-110' : 'border-gray-300'} shadow-xs`;
          swatch.style.backgroundColor = hex;
          swatch.onclick = () => {
            paintColor = hex;
            container.querySelectorAll('button').forEach(b => b.classList.remove('border-black', 'scale-110'));
            swatch.classList.add('border-black', 'scale-110');
          };
          container.appendChild(swatch);
        });
      }

      function openPaintEditor(char = null) {
        paintTargetChar = char;
        paintIsNew = !char;
        paintUndoStack = [];
        const modal = document.getElementById('modal-paint');
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('paint-char-name');

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (char) {
          nameInput.value = char.name;
          // Draw existing character onto canvas so user can edit it
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 60, 40, 300, 340);
            paintUndoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
          };
          if (char.imageUrl) {
            img.src = char.imageUrl;
          } else {
            const svgBlob = new Blob([char.svg], { type: 'image/svg+xml;charset=utf-8' });
            img.src = URL.createObjectURL(svgBlob);
          }
        } else {
          nameInput.value = 'My Drawing';
          paintUndoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        modal.classList.remove('hidden');
      }

      (function setupPaintCanvas() {
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let startX = 0, startY = 0;
        let snapshot = null;

        const getPos = (e) => {
          const r = canvas.getBoundingClientRect();
          return {
            x: ((e.clientX - r.left) / r.width) * canvas.width,
            y: ((e.clientY - r.top) / r.height) * canvas.height
          };
        };

        canvas.addEventListener('pointerdown', (e) => {
          drawing = true;
          canvas.setPointerCapture(e.pointerId);
          const pos = getPos(e);
          startX = pos.x;
          startY = pos.y;
          snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
          paintUndoStack.push(snapshot);
          if (paintUndoStack.length > 20) paintUndoStack.shift();

          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = paintSize;
          ctx.strokeStyle = paintColor;
          ctx.fillStyle = paintColor;

          if (paintTool === 'brush' || paintTool === 'eraser') {
            ctx.globalCompositeOperation = paintTool === 'eraser' ? 'destination-out' : 'source-over';
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(startX + 0.1, startY + 0.1);
            ctx.stroke();
          }
        });

        canvas.addEventListener('pointermove', (e) => {
          if (!drawing) return;
          const pos = getPos(e);
          if (paintTool === 'brush' || paintTool === 'eraser') {
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
          } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.putImageData(snapshot, 0, 0);
            ctx.beginPath();
            if (paintTool === 'line') {
              ctx.moveTo(startX, startY);
              ctx.lineTo(pos.x, pos.y);
              ctx.stroke();
            } else if (paintTool === 'rect') {
              ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
            } else if (paintTool === 'circle') {
              const rx = Math.abs(pos.x - startX) / 2;
              const ry = Math.abs(pos.y - startY) / 2;
              const cx = Math.min(startX, pos.x) + rx;
              const cy = Math.min(startY, pos.y) + ry;
              ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
        });

        canvas.addEventListener('pointerup', (e) => {
          drawing = false;
          ctx.globalCompositeOperation = 'source-over';
          if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
        });

        document.querySelectorAll('.paint-tool-btn').forEach(btn => {
          btn.onclick = () => {
            paintTool = btn.dataset.tool;
            document.querySelectorAll('.paint-tool-btn').forEach(b => {
              b.classList.remove('active', 'bg-[#4a89dc]', 'text-white');
              b.classList.add('bg-gray-100', 'text-gray-700');
            });
            btn.classList.add('active', 'bg-[#4a89dc]', 'text-white');
            btn.classList.remove('bg-gray-100', 'text-gray-700');
          };
        });

        document.querySelectorAll('.paint-size-btn').forEach(btn => {
          btn.onclick = () => {
            paintSize = parseInt(btn.dataset.size, 10);
            document.querySelectorAll('.paint-size-btn').forEach(b => b.classList.remove('bg-[#4a89dc]/30', 'ring-2', 'ring-[#4a89dc]'));
            btn.classList.add('bg-[#4a89dc]/30', 'ring-2', 'ring-[#4a89dc]');
          };
        });

        document.getElementById('paint-clear').onclick = () => {
          paintUndoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        document.getElementById('paint-undo').onclick = () => {
          if (paintUndoStack.length > 0) {
            ctx.putImageData(paintUndoStack.pop(), 0, 0);
          }
        };

        document.getElementById('paint-save').onclick = () => {
          const dataUrl = canvas.toDataURL('image/png');
          const newName = document.getElementById('paint-char-name').value.trim() || 'Character';
          const page = getActivePage();

          if (paintIsNew) {
            const newChar = {
              id: nextId(),
              name: newName,
              svg: '',
              imageUrl: dataUrl,
              x: 50,
              y: 50,
              initX: 50,
              initY: 50,
              scale: 1,
              initScale: 1,
              rotation: 0,
              initRotation: 0,
              facing: 1,
              isWalking: false,
              visible: true,
              initVisible: true,
              speed: 'medium',
              speechText: '',
              scripts: []
            };
            page.characters.push(newChar);
            page.selectedCharId = newChar.id;
          } else if (paintTargetChar) {
            paintTargetChar.name = newName;
            paintTargetChar.imageUrl = dataUrl;
          }

          document.getElementById('modal-paint').classList.add('hidden');
          renderAll();
        };
      })();

      // Microphone Sound Recorder (In-Memory Blob URL)
      let mediaRecorder = null;
      let recordedChunks = [];
      let pendingAudioUrl = null;

      function openSoundRecorder() {
        pendingAudioUrl = null;
        document.getElementById('recorder-status').textContent = 'Tap the red button to record';
        document.getElementById('btn-rec-start').disabled = false;
        document.getElementById('btn-rec-stop').disabled = true;
        document.getElementById('btn-rec-play').disabled = true;
        document.getElementById('btn-rec-save').disabled = true;
        document.getElementById('modal-recorder').classList.remove('hidden');
      }

      document.getElementById('btn-rec-start').onclick = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            pendingAudioUrl = URL.createObjectURL(blob);
            document.getElementById('recorder-status').textContent = 'Sound ready! Tap play or Done.';
            document.getElementById('btn-rec-play').disabled = false;
            document.getElementById('btn-rec-save').disabled = false;
          };
          mediaRecorder.start();
          document.getElementById('recorder-status').textContent = 'Recording... Speak now!';
          document.getElementById('btn-rec-start').disabled = true;
          document.getElementById('btn-rec-stop').disabled = false;
        } catch (err) {
          document.getElementById('recorder-status').textContent = 'Microphone permission blocked by browser.';
        }
      };

      document.getElementById('btn-rec-stop').onclick = () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
          document.getElementById('btn-rec-stop').disabled = true;
          document.getElementById('btn-rec-start').disabled = false;
        }
      };

      document.getElementById('btn-rec-play').onclick = () => {
        if (pendingAudioUrl) {
          new Audio(pendingAudioUrl).play().catch(() => {});
        }
      };

      document.getElementById('btn-rec-save').onclick = () => {
        if (pendingAudioUrl) {
          state.recordedSounds.push({
            id: nextId(),
            audioUrl: pendingAudioUrl
          });
          document.getElementById('modal-recorder').classList.add('hidden');
          renderPalette();
        }
      };

      // ===================================================================
      // 14. TOOLBAR & NAVIGATION EVENT LISTENERS
      // ===================================================================
      // Category Tabs
      document.querySelectorAll('.cat-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          state.activeCategory = tab.dataset.cat;
          renderPalette();
        });
      });

      // Home Button (Clear Session Confirmation Modal — NO project save/gallery)
      document.getElementById('btn-home').addEventListener('click', () => {
        document.getElementById('modal-confirm').classList.remove('hidden');
      });
      document.getElementById('confirm-cancel').addEventListener('click', () => {
        document.getElementById('modal-confirm').classList.add('hidden');
      });
      document.getElementById('confirm-ok').addEventListener('click', () => {
        stopAllScripts();
        state.pages = [createPage(0)];
        state.activePageIndex = 0;
        state.activeCategory = 'yellow';
        state.recordedSounds = [];
        state.history = [];
        state.redoStack = [];
        document.getElementById('modal-confirm').classList.add('hidden');
        renderAll();
        showToast('Started a fresh project');
      });

      // Fullscreen Stage Toggle
      document.getElementById('btn-fullscreen').addEventListener('click', () => {
        state.isFullscreen = !state.isFullscreen;
        document.body.classList.toggle('presentation-mode', state.isFullscreen);
      });

      // Coordinate Grid Toggle
      document.getElementById('btn-grid').addEventListener('click', () => {
        state.showGrid = !state.showGrid;
        const overlay = document.getElementById('stage-grid-overlay');
        overlay.classList.toggle('hidden', !state.showGrid);
        document.getElementById('btn-grid').classList.toggle('ring-2', state.showGrid);
        document.getElementById('btn-grid').classList.toggle('ring-[#4a89dc]', state.showGrid);
      });

      // Populate Coordinate Grid Numbers (1..20 X, 1..15 Y)
      (function buildGridNumbers() {
        const container = document.getElementById('grid-numbers');
        let html = '';
        for (let x = 1; x <= 20; x++) {
          html += `<span class="absolute bottom-0.5" style="left:${(x - 0.7) * 5}%">${x}</span>`;
        }
        for (let y = 1; y <= 15; y++) {
          html += `<span class="absolute left-1" style="top:${(15 - y + 0.15) * 6.6667}%">${y}</span>`;
        }
        container.innerHTML = html;
      })();

      // Background Library Button
      document.getElementById('btn-background').addEventListener('click', openBackgroundLibrary);

      // Add Text (ABC) Button
      document.getElementById('btn-add-text').addEventListener('click', () => {
        const page = getActivePage();
        const pop = document.getElementById('param-popover');
        const content = document.getElementById('param-popover-content');
        const btnRect = document.getElementById('btn-add-text').getBoundingClientRect();

        pop.style.left = `${Math.max(10, btnRect.left - 80)}px`;
        pop.style.top = `${btnRect.bottom + 8}px`;
        content.innerHTML = `
          <div class="flex flex-col gap-2">
            <span class="text-xs font-extrabold text-gray-500">STAGE TITLE TEXT</span>
            <div class="flex items-center gap-2">
              <input id="stage-text-inp" type="text" maxlength="36" value="${escapeHtml(page.titleText)}" placeholder="Enter title..." class="border-2 border-[#4a89dc] rounded-xl px-3 py-1.5 font-bold text-gray-800 w-44 outline-none"/>
              <button id="stage-text-save" class="sjr-btn bg-[#4a89dc] text-white font-extrabold px-3 py-1.5 rounded-xl">OK</button>
            </div>
          </div>
        `;
        pop.classList.remove('hidden');
        const inp = document.getElementById('stage-text-inp');
        inp.focus();
        document.getElementById('stage-text-save').onclick = () => {
          page.titleText = inp.value;
          pop.classList.add('hidden');
          renderStage();
        };
      });

      document.getElementById('stage-title-display').addEventListener('click', () => {
        document.getElementById('btn-add-text').click();
      });

      // Reset Characters Button
      document.getElementById('btn-reset-chars').addEventListener('click', resetAllCharactersOnPage);

      // Green Flag Run Button
      document.getElementById('btn-green-flag').addEventListener('click', triggerGreenFlag);

      // Add Character '+' Button
      document.getElementById('btn-add-character').addEventListener('click', openCharacterLibrary);

      // Open Paint Editor for a brand new character from Character Library
      document.getElementById('btn-open-paint-new').addEventListener('click', () => {
        document.getElementById('modal-characters').classList.add('hidden');
        openPaintEditor(null);
      });

      // Local In-Memory Image Uploads (Character & Background — No Storage)
      document.getElementById('input-upload-char').addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const page = getActivePage();
        const newChar = {
          id: nextId(),
          name: file.name.replace(/\.[^/.]+$/, '').slice(0, 12) || 'Sprite',
          svg: '',
          imageUrl: url,
          x: 50,
          y: 50,
          initX: 50,
          initY: 50,
          scale: 1,
          initScale: 1,
          rotation: 0,
          initRotation: 0,
          facing: 1,
          isWalking: false,
          visible: true,
          initVisible: true,
          speed: 'medium',
          speechText: '',
          scripts: []
        };
        page.characters.push(newChar);
        page.selectedCharId = newChar.id;
        document.getElementById('modal-characters').classList.add('hidden');
        e.target.value = '';
        renderAll();
      });

      document.getElementById('input-upload-bg').addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const page = getActivePage();
        page.customBgUrl = URL.createObjectURL(file);
        document.getElementById('modal-backgrounds').classList.add('hidden');
        e.target.value = '';
        renderStage();
        renderPagesSidebar();
      });

      // Add Page '+' Button
      document.getElementById('btn-add-page').addEventListener('click', () => {
        if (state.pages.length >= 4) return;
        stopAllScripts();
        const newPg = createPage(state.pages.length);
        state.pages.push(newPg);
        state.activePageIndex = state.pages.length - 1;
        renderAll();
      });

      // Undo & Redo Buttons
      document.getElementById('btn-undo').addEventListener('click', () => {
        if (state.history.length === 0) return;
        const snap = state.history.pop();
        const page = state.pages[snap.pageIndex];
        const char = page?.characters.find(c => c.id === snap.charId);
        if (char) {
          state.redoStack.push({
            pageIndex: snap.pageIndex,
            charId: char.id,
            scripts: JSON.parse(JSON.stringify(char.scripts))
          });
          char.scripts = snap.scripts;
          renderWorkspace();
        }
        updateUndoRedoButtons();
      });

      document.getElementById('btn-redo').addEventListener('click', () => {
        if (state.redoStack.length === 0) return;
        const snap = state.redoStack.pop();
        const page = state.pages[snap.pageIndex];
        const char = page?.characters.find(c => c.id === snap.charId);
        if (char) {
          state.history.push({
            pageIndex: snap.pageIndex,
            charId: char.id,
            scripts: JSON.parse(JSON.stringify(char.scripts))
          });
          char.scripts = snap.scripts;
          renderWorkspace();
        }
        updateUndoRedoButtons();
      });

      // Close Modals
      document.querySelectorAll('.close-modal').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.closest('.fixed').classList.add('hidden');
        });
      });

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // ===================================================================
      // 15. INITIAL BOOT RENDER
      // ===================================================================
      function renderAll() {
        renderCharactersSidebar();
        renderStage();
        renderPagesSidebar();
        renderPalette();
        renderWorkspace();
        updateUndoRedoButtons();
      }

      window.addEventListener('load', () => {
        initPaintPalette();
        renderAll();
      });
    })();
  </script>
</body>
